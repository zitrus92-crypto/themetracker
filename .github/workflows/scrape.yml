name: Finviz Scrape (twice daily, NY time)

# Refreshes all data around the US close on weekdays.
#
# GitHub Actions cron is UTC-only and does NOT observe daylight saving time,
# and scheduled runs are "best effort" (often delayed 15 min to a few hours).
# We therefore schedule four UTC slots covering both 15:30 and 17:00 New York
# time in summer (EDT) and winter (EST), and run every time WITHOUT a wall-clock
# gate — GitHub's delays make exact-time gating unreliable. The data writes are
# idempotent per date, so extra runs simply overwrite the day's entry with
# fresher data.
#
#   19:30 UTC → 15:30 EDT (summer) / 14:30 EST (winter)
#   20:30 UTC → 16:30 EDT          / 15:30 EST
#   21:00 UTC → 17:00 EDT          / 16:00 EST
#   22:00 UTC → 18:00 EDT          / 17:00 EST

on:
  schedule:
    - cron: '30 19 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '0 21 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Manual trigger via GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/etf_data.json docs/etf_perf.json docs/history.json docs/regime.json
          git diff --staged --quiet || git commit -m "data: update $(TZ='America/New_York' date '+%Y-%m-%d %H:%M %Z')"
          git push
