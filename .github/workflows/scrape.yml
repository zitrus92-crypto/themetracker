name: Finviz Scrape (hourly during RTH, NY time)

# Refreshes all data hourly (on the full hour) through the US regular trading
# session on weekdays, plus one settled post-close run.
#
# GitHub Actions cron is UTC-only and does NOT observe daylight saving time,
# and scheduled runs are "best effort" (often delayed 15 min to a few hours).
# We therefore schedule hourly UTC slots that cover 10:00–16:00 New York time
# in BOTH summer (EDT, UTC-4) and winter (EST, UTC-5), and run every time
# WITHOUT a wall-clock gate — GitHub's delays make exact-time gating
# unreliable. The data writes are idempotent per date, so extra runs simply
# overwrite the day's entry with fresher data.
#
#   14:00–21:00 UTC hourly → 10:00–17:00 EDT (summer) / 09:00–16:00 EST (winter)
#   22:00 UTC              → 18:00 EDT               / 17:00 EST (settled close)

on:
  schedule:
    - cron: '0 14-21 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Manual trigger via GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Guard: broken metric logic must never ship data. themeMetrics.js is the
      # single implementation of the stage/segment math (client + report).
      - name: Run metric tests
        run: node --test docs/static/themeMetrics.test.js

      - name: Run calendar/snapshot tests
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/etf_data.json docs/etf_perf.json docs/history.json docs/regime.json docs/setups.json docs/snapshots
          git diff --staged --quiet || git commit -m "data: update $(TZ='America/New_York' date '+%Y-%m-%d %H:%M %Z')"
          git push
